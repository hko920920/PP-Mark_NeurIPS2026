[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppmark"
version = "0.4.0"
description = "PP-Mark: Provable and Publicly Verifiable Watermarking for Generative AI"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
  {name = "Hankyeong Ko", email = "hko920920@sogang.ac.kr"},
  {name = "Taehoon Kim", email = "taehoonkim@sogang.ac.kr"},
]
dependencies = [
  "numpy>=1.24,<2",
  "opencv-python-headless>=4.8,<4.11",
  "pillow>=10.4",
  "pywavelets>=1.6",
  "scipy>=1.11",
  "reedsolo>=1.7.0",
  "py-ecc>=7.0.0,<8",
]

[project.optional-dependencies]
evaluation = ["cryptography>=41", "pyiqa==0.1.16", "matplotlib>=3.7"]
dev = ["pytest>=8"]

[project.scripts]
ppmark = "ppmark_v03.cli:main"

[project.urls]
Repository = "https://github.com/hko920920/PP-Mark_NeurIPS2026"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ppmark_v03*"]
