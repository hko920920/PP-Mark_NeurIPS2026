[package]
name = "sp1-genguard-guest"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "sp1-genguard-guest"
path = "src/main.rs"

[[bin]]
name = "sp1-genguard-streaming"
path = "src/bin/streaming.rs"

[dependencies]
sp1-zkvm = "6.3.1"
sha2 = "0.10.9"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
