[package]
name = "sp1-genguard-host"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow.workspace = true
bincode.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sp1-sdk.workspace = true
sp1-genguard-guest = { path = "../guest" }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
sp1-build = "6.3.1"

[features]
default = []
cuda = ["sp1-sdk/cuda"]
